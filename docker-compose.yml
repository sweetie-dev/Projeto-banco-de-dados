services:
  app:
    image: ghcr.io/sweetie-dev/projeto-banco-de-dados:latest
    container_name: event-food-sales
    restart: always
    expose:
      - 3000
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB=${MONGODB_DB}
      - JWT_SECRET=${JWT_SECRET}
      - APP_DOMAIN=${APP_DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.event-food-sales.rule=Host(`${APP_DOMAIN:-vendas.exemplo.com}`)"
      - "traefik.http.routers.event-food-sales.entrypoints=websecure"
      - "traefik.http.routers.event-food-sales.tls.certresolver=myresolver"
      - "traefik.http.services.event-food-sales.loadbalancer.server.port=3000"
    networks:
      - traefik-net

networks:
  traefik-net:
    external: true
